include colours.conf

window_padding_width 5
background_opacity 0.85
cursor_trail 1
cursor_shape underline
cursor_shape_unfocused underline
custom_shaders cursor-trail-motion-blur
cursor_trail_start_threshold 0

font_size 13.2

confirm_os_window_close 0

# BEGIN_KITTY_FONTS
font_family      family='Maple Mono NF CN' style=Bold
bold_font        family='Maple Mono NF CN' style=ExtraBold
italic_font      family='Maple Mono NF CN' style='Bold Italic'
bold_italic_font family='Maple Mono NF CN' style='ExtraBold Italic'
# END_KITTY_FONTS
